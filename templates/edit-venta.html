{% extends "layout.html" %}
{% block body %}

<div class="col-md-4 offset-md-4">
    <div class="card card-body">
        <form action="/update_detalle_venta/{{ detalle_venta.0 }}" method="POST">

            <!-- Select para Venta (preseleccionado) -->
            <div class="form-group">
                <select name="id_venta" class="form-control" required>
                    <option value="">Seleccione una venta</option>
                    {% for v in ventas %}
                    <option value="{{ v.0 }}" {% if v.0 == detalle_venta.1 %}selected{% endif %}>
                        Venta #{{ v.0 }} - Fecha: {{ v.1 }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Select para Producto (preseleccionado) -->
            <div class="form-group">
                <select name="id_producto" class="form-control" required>
                    <option value="">Seleccione un producto</option>
                    {% for p in productos %}
                    <option value="{{ p.0 }}" {% if p.0 == detalle_venta.2 %}selected{% endif %}>
                        {{ p.1 }} (ID: {{ p.0 }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <input type="number" name="cantidad" placeholder="Cantidad" value="{{ detalle_venta.3 }}" class="form-control" required>
            </div>

            <div class="form-group">
                <input type="number" step="0.01" name="precio_unitario" placeholder="Precio Unitario" value="{{ detalle_venta.4 }}" class="form-control" required>
            </div>

            <div class="form-group">
                <input type="number" step="0.01" name="descuento" placeholder="Descuento" value="{{ detalle_venta.5 }}" class="form-control">
            </div>

            <div class="form-group mt-3">
                <button type="submit" class="btn btn-success w-100">Guardar</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
